name: JARED'S EMERALD - Build and Patch

on:
  workflow_dispatch:
  push:
    branches:
      - jareds-emerald-dev

permissions:
  contents: read

concurrency:
  group: jareds-emerald-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-emerald:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Emerald build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3 git

      - name: Test BPS patch generator
        run: python3 tools/make_bps_patch.py --self-test

      - name: Check JARED'S EMERALD features
        run: python3 tools/check_jareds_emerald_teams.py

      - name: Build Emerald
        run: make -j2 -O all
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
          UNUSED_ERROR: 1
          DEPRECATED_ERROR: 1

      - name: Check that a ROM was produced
        run: |
          test -f pokeemerald.gba
          test "$(stat -c%s pokeemerald.gba)" -gt 0
          sha256sum pokeemerald.gba

      - name: Run pokeemerald regression test suite
        # EXP formula tests explicitly unlock the badge/League progression so they test
        # experience calculations independently of JARED'S EMERALD's intended hard caps.
        run: make -j2 -O check
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
          UNUSED_ERROR: 1
          DEPRECATED_ERROR: 1

      - name: Check out matching clean Emerald source
        uses: actions/checkout@v4
        with:
          repository: pret/pokeemerald
          ref: 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          path: vanilla
          submodules: recursive

      - name: Build and install agbcc for clean Emerald source
        run: |
          git clone https://github.com/pret/agbcc agbcc
          cd agbcc
          ./build.sh
          ./install.sh ../vanilla

      - name: Build clean Emerald base ROM
        working-directory: vanilla
        run: make -j2 -O all
        env:
          COMPARE: 0

      - name: Verify clean Emerald revision 0 checksum
        run: |
          test -f vanilla/pokeemerald.gba
          actual="$(sha1sum vanilla/pokeemerald.gba | cut -d' ' -f1)"
          echo "Clean Emerald SHA-1: $actual"
          test "$actual" = "f3ae088181bf583e55daf962a92bb46f4f1d07b7"

      - name: Generate and verify BPS patch
        run: python3 tools/make_bps_patch.py vanilla/pokeemerald.gba pokeemerald.gba jareds-emerald.bps

      - name: Check that a patch was produced
        run: |
          test -f jareds-emerald.bps
          test "$(stat -c%s jareds-emerald.bps)" -gt 0
          sha256sum jareds-emerald.bps

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: jareds-emerald-patch
          path: jareds-emerald.bps
          if-no-files-found: error
          retention-days: 14
